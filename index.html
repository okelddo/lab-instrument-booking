<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>實驗室儀器預約系統</title>
  <style>
    :root { --bg:#f3f5f8; --paper:#fff; --ink:#1c2430; --muted:#5b6778; --line:#d7dee8; --accent:#0f6e6a; --danger:#b42318; --shadow:0 10px 30px rgba(20,40,60,.08); }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC",sans-serif; }
    header { background:linear-gradient(135deg,#0b3d3b 0%,#0f6e6a 55%,#2a7ab5 100%); color:#fff; padding:22px 24px 20px; }
    .wrap { max-width:1400px; margin:0 auto; }
    header h1 { margin:0 0 6px; font-size:26px; }
    header p { margin:0; opacity:.9; font-size:14px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:end; padding:16px 0 8px; }
    .field { display:flex; flex-direction:column; gap:4px; }
    .field label { font-size:12px; color:var(--muted); font-weight:700; }
    input,select,button { font-family:inherit; font-size:14px; }
    input,select { border:1px solid var(--line); border-radius:10px; padding:9px 11px; background:#fff; }
    .name-box { border:2px solid #9ad8d4; min-width:180px; font-weight:700; }
    .btn { border:0; border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:700; background:var(--accent); color:#fff; }
    .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn.danger { background:var(--danger); }
    .week-nav { display:flex; gap:8px; align-items:center; }
    .week-label { font-weight:800; min-width:210px; text-align:center; }
    .legend { font-size:12px; color:var(--muted); padding:4px 0 8px; }
    .board { background:var(--paper); border-radius:16px; box-shadow:var(--shadow); overflow:auto; margin-bottom:28px; }
    table.grid { border-collapse:separate; border-spacing:0; min-width:1100px; width:100%; }
    .grid th,.grid td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); vertical-align:top; }
    .grid th { background:#eef3f7; font-size:13px; padding:10px 8px; }
    .grid td.inst { background:#f8fafc; font-weight:800; font-size:13px; padding:10px; min-width:170px; }
    .grid td.cell { min-width:160px; height:92px; padding:6px; }
    .grid td.cell.today { background:#f3fbfa; }
    .cell-list { display:flex; flex-direction:column; gap:5px; min-height:70px; }
    .booking { border-radius:8px; padding:5px 7px; font-size:12px; color:#fff; cursor:pointer; }
    .booking .who { font-weight:800; }
    .add { border:1px dashed #c5d0dc; background:#f8fbff; color:#3c4b5c; border-radius:8px; padding:4px 6px; font-size:12px; cursor:pointer; text-align:center; }
    .empty { color:#98a4b3; font-size:12px; }
    .modal-bg { position:fixed; inset:0; background:rgba(16,24,32,.45); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
    .modal-bg.show { display:flex; }
    .modal { width:min(520px,100%); background:#fff; border-radius:16px; padding:18px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .form-grid .full { grid-column:1/-1; }
    .hint { font-size:12px; color:var(--muted); }
    .alert { display:none; background:#fef3f2; color:#912018; border:1px solid #fecdca; border-radius:10px; padding:8px 10px; font-size:13px; margin:8px 0; }
    .alert.show { display:block; }
    .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .toast { position:fixed; right:16px; bottom:16px; background:#10231f; color:#fff; padding:10px 14px; border-radius:10px; display:none; z-index:30; }
    .toast.show { display:block; }
    footer { color:var(--muted); font-size:12px; padding-bottom:30px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>實驗室儀器預約系統</h1>
      <p>填寫使用者名稱與時段即可預約。同一儀器在相同時段不可重複預約。</p>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <div class="field">
        <label for="userName">使用者名稱（必填）</label>
        <input id="userName" class="name-box" placeholder="例如 WG OT1 / Chester" />
      </div>
      <div class="field">
        <label>週次</label>
        <div class="week-nav">
          <button class="btn ghost" id="prevWeek">上一週</button>
          <div class="week-label" id="weekLabel"></div>
          <button class="btn ghost" id="nextWeek">下一週</button>
          <button class="btn ghost" id="thisWeek">本週</button>
        </div>
      </div>
      <button class="btn" id="newBooking">＋ 新增預約</button>
      <button class="btn ghost" id="loadSample">載入範例週表</button>
      <button class="btn ghost" id="exportData">匯出 JSON</button>
      <button class="btn ghost" id="importBtn">匯入 JSON</button>
      <input id="importFile" type="file" accept="application/json" hidden />
      <button class="btn" id="connectNas">連接 NAS 資料夾</button>
      <button class="btn ghost" id="importNas">從 NAS 重新匯入</button>
    </div>
    <div class="legend">共用資料夾：\\nas\Temp\ChesterHsu　檔名：instrument-bookings.json。使用前自動匯入，預約完成後自動存回。請用 Chrome / Edge。</div>
    <div class="legend" id="nasStatus">尚未連接 NAS</div>
    <div class="board"><table class="grid" id="grid"></table></div>
    <footer>網址：https://okelddo.github.io/lab-instrument-booking/ 。若看不到週表請 Ctrl+F5。</footer>
  </div>
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2 id="modalTitle">新增預約</h2>
      <div class="form-grid">
        <div class="field full"><label>使用者名稱</label><input id="fName" placeholder="必填" /></div>
        <div class="field full"><label>儀器</label><select id="fInst"></select></div>
        <div class="field"><label>日期</label><input id="fDate" type="date" /></div>
        <div class="field"><label>備註</label><input id="fNote" placeholder="例如 SC26482-01" /></div>
        <div class="field"><label>開始時間</label><input id="fStart" type="time" value="09:00" /></div>
        <div class="field"><label>結束時間</label><input id="fEnd" type="time" value="18:00" /></div>
      </div>
      <div class="hint">結束時間必須晚於開始時間。時段重疊會被拒絕。</div>
      <div class="alert" id="formAlert"></div>
      <div class="actions">
        <button class="btn danger" id="deleteBtn" style="display:none;margin-right:auto;">取消此預約</button>
        <button class="btn ghost" id="cancelBtn">關閉</button>
        <button class="btn" id="saveBtn">儲存預約</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    (function () {
      var urls = [
        "./app.js?v=nas1",
        "https://cdn.jsdelivr.net/gh/okelddo/lab-instrument-booking@main/app.js",
        "https://raw.githubusercontent.com/okelddo/lab-instrument-booking/main/app.js"
      ];
      function load(i) {
        if (i >= urls.length) {
          var el = document.getElementById("weekLabel");
          if (el) el.textContent = "脚本載入失敗，請 Ctrl+F5";
          return;
        }
        fetch(urls[i]).then(function (r) {
          if (!r.ok) throw new Error("bad");
          return r.text();
        }).then(function (code) {
          if (code.indexOf("NAS_FILE") === -1 && code.indexOf("connectNasFolder") === -1) throw new Error("old");
          (0, eval)(code);
        }).catch(function () { load(i + 1); });
      }
      load(0);
    })();
  </script>
</body>
</html>
